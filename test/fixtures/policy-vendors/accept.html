<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loads Hotjar after consent</title>
  </head>
  <body>
    <h1>Welcome</h1>
    <footer>
      <a href="/clean/impressum.html">Imprint</a>
      <a href="privacy.html">Privacy policy</a>
    </footer>
    <div id="banner" role="dialog" aria-label="Cookie settings">
      <p>We use cookies to understand how you use our site.</p>
      <button id="accept">Accept all</button>
      <button id="reject">Reject all</button>
    </div>
    <script>
      const banner = document.getElementById('banner');
      const choice = localStorage.getItem('consent');
      if (choice === 'accepted') {
        const tag = document.createElement('script');
        tag.src = 'https://static.hotjar.com/c/hotjar-123.js?sv=6';
        document.head.append(tag);
      }
      if (choice) banner.remove();
      document.getElementById('accept').onclick = () => {
        localStorage.setItem('consent', 'accepted');
        location.reload();
      };
      document.getElementById('reject').onclick = () => {
        localStorage.setItem('consent', 'rejected');
        banner.remove();
      };
    </script>
  </body>
</html>
