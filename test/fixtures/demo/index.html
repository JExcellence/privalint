<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Café Morgenrot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora&amp;display=swap" />
  </head>
  <body>
    <h1>Café Morgenrot</h1>
    <iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" title="So entsteht unser Brot"></iframe>
    <footer>
      <a href="/clean/impressum.html">Impressum</a>
      <a href="/clean/datenschutz.html">Datenschutz</a>
      <a href="#">Datenschutz-Einstellungen</a>
    </footer>
    <div id="banner" role="dialog" aria-label="Cookie-Einstellungen">
      <p>Wir verwenden Cookies, um die Nutzung der Website zu analysieren.</p>
      <button id="accept">Alle akzeptieren</button>
      <button id="reject">Alle ablehnen</button>
    </div>
    <script>
      const banner = document.getElementById('banner');
      const choice = localStorage.getItem('consent');
      if (choice) {
        const tag = document.createElement('script');
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-MORGENROT';
        document.head.append(tag);
      }
      if (choice) {
        banner.remove();
      }
      document.getElementById('accept').onclick = () => {
        localStorage.setItem('consent', 'accepted');
        location.reload();
      };
      document.getElementById('reject')?.addEventListener('click', () => {
        localStorage.setItem('consent', 'rejected');
        banner.remove();
      });
    </script>
  </body>
</html>
