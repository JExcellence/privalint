<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Banner that appears 2.5 s after load</title>
  </head>
  <body>
    <h1>Banner that appears 2.5 s after load</h1>
    <footer>
      <a href="/clean/impressum.html">Impressum</a>
      <a href="/clean/datenschutz.html">Datenschutz</a>
      <button type="button">Cookie-Einstellungen</button>
    </footer>
    <div id="banner" hidden role="dialog" aria-label="Cookie-Einstellungen">
      <p>Wir verwenden Cookies, um die Nutzung der Website zu analysieren.</p>
      <button id="accept">Alle akzeptieren</button>
      <button id="reject">Alle ablehnen</button>
    </div>
    <script>
      const banner = document.getElementById('banner');
      const choice = localStorage.getItem('consent');
      if (choice === 'accepted') {
        const tag = document.createElement('script');
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-CONSENT';
        document.head.append(tag);
      }
      if (choice) {
        banner.remove();
      } else {
        // Like a consent manager that waits for a geo lookup before it shows anything.
        window.addEventListener('load', () => setTimeout(() => (banner.hidden = false), 2500));
      }
      document.getElementById('accept').onclick = () => {
        localStorage.setItem('consent', 'accepted');
        location.reload();
      };
      document.getElementById('reject')?.addEventListener('click', () => {
        localStorage.setItem('consent', 'rejected');
        banner.remove();
      });
    </script>
  </body>
</html>
