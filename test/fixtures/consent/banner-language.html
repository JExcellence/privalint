<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <title>English banner on a Hungarian page</title>
  </head>
  <body>
    <h1>Üdvözöljük</h1>
    <footer>
      <a href="/clean/impressum.html">Impressum</a>
      <a href="/clean/datenschutz.html">Datenschutz</a>
      <button type="button">Cookie-Einstellungen</button>
    </footer>
    <div id="banner" role="dialog" aria-label="Cookie settings">
      <p>We use cookies to understand how you use our site. You can accept all cookies or reject the ones that are not needed for this site to work.</p>
      <button id="accept">Accept all</button>
      <button id="reject">Reject all</button>
    </div>
    <script>
      const banner = document.getElementById('banner');
      const choice = localStorage.getItem('consent');
      if (choice === 'accepted') {
        const tag = document.createElement('script');
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-CONSENT';
        document.head.append(tag);
      }
      if (choice) {
        banner.remove();
      }
      document.getElementById('accept').onclick = () => {
        localStorage.setItem('consent', 'accepted');
        location.reload();
      };
      document.getElementById('reject')?.addEventListener('click', () => {
        localStorage.setItem('consent', 'rejected');
        banner.remove();
      });
    </script>
  </body>
</html>
