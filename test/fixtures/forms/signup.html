<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="unsafe-url" />
    <title>Konto anlegen</title>
  </head>
  <body>
    <h1>Konto anlegen</h1>
    <form action="http://forms.example.test/signup">
      <label>E-Mail <input type="email" name="email" /></label>
      <label><input type="checkbox" name="terms" checked /> Ich akzeptiere die AGB.</label>
      <label>
        <input type="checkbox" name="newsletter" checked /> Ja, ich möchte den Newsletter mit
        Angeboten erhalten.
      </label>
      <input type="checkbox" id="partners" name="partners" />
      <label for="partners">Werbung von Partnern per E-Mail</label>
      <p>Hinweise in der <a href="/clean/datenschutz.html">Datenschutzerklärung</a>.</p>
      <button>Registrieren</button>
    </form>
    <img src="http://img.example.test/logo.png" alt="" />
    <footer>
      <a href="/clean/impressum.html">Impressum</a>
      <a href="/clean/datenschutz.html">Datenschutz</a>
    </footer>
  </body>
</html>
