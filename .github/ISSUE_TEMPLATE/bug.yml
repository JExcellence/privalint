name: Bug report
description: privalint crashed, hung or produced a broken report.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command or Action configuration you ran.
      placeholder: npx privalint https://example.de --max-pages 5
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Paste the output. Remove anything you don't want to share.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: privalint version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS
      placeholder: Node 22, Ubuntu 24.04
