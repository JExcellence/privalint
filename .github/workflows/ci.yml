name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run schemas:check
      - run: npm test
      - run: npm run build

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: privalint
        uses: ./
        with:
          url: https://example.com
          # IANA has no consent banner; reject-path checks are deliberate exclusions here.
          disable: impressum-link,trackers-after-reject,reject-option,consent-settings-link
          fail-on-incomplete: "true"
          concurrency: "2"
      - name: Check outputs
        env:
          EXIT_CODE: ${{ steps.privalint.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = "0"
          test -s privalint.sarif
