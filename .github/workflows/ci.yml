name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: privalint
        uses: ./
        with:
          url: https://example.com
          disable: impressum-link
      - name: Check outputs
        env:
          EXIT_CODE: ${{ steps.privalint.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = "0"
          test -s privalint.sarif
