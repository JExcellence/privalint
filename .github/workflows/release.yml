name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # to move the major version tag
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Explain the skipped npm publish
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN is not set, so this release was not published to npm. The GitHub Action release still works."

      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as it is."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version}" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

      - name: Move the major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major"
          git push --force origin "refs/tags/$major"
