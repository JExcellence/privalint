name: privalint
description: Scan a website for GDPR problems such as trackers before consent, Google Fonts and a missing Impressum.
author: JExcellence
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: Page to scan, usually your production URL or a preview deployment.
    required: true
  max-pages:
    description: How many pages on the same host to crawl.
    default: "1"
  fail-on:
    description: Fail the step on findings at this level or above. One of error, warning, never.
    default: error
  disable:
    description: Comma-separated rule ids to skip.
    default: ""
  lang:
    description: Language of the report and the job summary. One of en, de.
    default: en
  region:
    description: Tool reference and severity profile, not a determination of applicable law. One of de, at, ch, eu.
    default: de
  sarif-file:
    description: Where to write the SARIF report, relative to the workspace. Empty to skip.
    default: privalint.sarif
  job-summary:
    description: Add a Markdown report to the job summary.
    default: "true"
  pr-comment:
    description: Create or update a report comment on same-repository pull requests. Requires pull-requests write permission.
    default: "false"

outputs:
  sarif-file:
    description: Path of the SARIF report. Empty if none was written.
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: 0 for no findings at the fail-on level, 1 for findings, 2 for a failed scan.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    # Uses the runner's Node instead of setup-node, so the caller's Node version stays untouched.
    - name: Install privalint
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        node -e '
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 20 || (major === 20 && minor < 12)) {
            console.error(`privalint needs Node 20.12 or newer, found ${process.version}. Add actions/setup-node before this step.`);
            process.exit(1);
          }'
        npm ci --no-audit --no-fund
        npm run build
        npx playwright install --with-deps --only-shell chromium

    - name: Scan
      id: scan
      shell: bash
      env:
        URL: ${{ inputs.url }}
        MAX_PAGES: ${{ inputs.max-pages }}
        FAIL_ON: ${{ inputs.fail-on }}
        DISABLE: ${{ inputs.disable }}
        REPORT_LANG: ${{ inputs.lang }}
        REGION: ${{ inputs.region }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        if [[ -n "$SARIF_FILE" && "$SARIF_FILE" != *.sarif ]]; then
          echo "::error::sarif-file must end in .sarif, got '$SARIF_FILE'"
          exit 2
        fi

        summary="$RUNNER_TEMP/privalint.md"
        # A failed scan must not post a report left by a previous action invocation.
        node -e 'require("node:fs").rmSync(process.argv[1], {force: true})' "$summary"
        args=("$URL" --max-pages "$MAX_PAGES" --fail-on "$FAIL_ON" --lang "$REPORT_LANG" --region "$REGION" --output "$summary")
        if [[ -n "$DISABLE" ]]; then args+=(--disable "$DISABLE"); fi
        if [[ -n "$SARIF_FILE" ]]; then args+=(--output "$SARIF_FILE"); fi

        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
        code=$?
        set -e

        if [[ "$JOB_SUMMARY" == "true" && -f "$summary" ]]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ -n "$SARIF_FILE" && -f "$SARIF_FILE" ]]; then
          echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Comment on pull request
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.scan.outputs.exit-code != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PRIVALINT_REPORT: ${{ runner.temp }}/privalint.md
      run: node "$GITHUB_ACTION_PATH/scripts/pr-comment.mjs"
