  <text x="20" y="106" xml:space="preserve">https://cafe-morgenrot.example/</text>
  <text x="20" y="125" xml:space="preserve">  <tspan fill="#ff7b72">✖</tspan> Google Analytics (analytics) still runs after clicking "Alle ablehnen". <tspan fill="#8b949e">trackers-after-reject</tspan></text>
  <text x="20" y="144" xml:space="preserve"><tspan fill="#8b949e">      request https://www.googletagmanager.com/gtag/js?id=G-MORGENROT</tspan></text>
  <text x="20" y="163" xml:space="preserve">      <tspan fill="#56d4dd">fix:</tspan> Check that Google Analytics is assigned to a consent category in your consent manager an…</text>
  <text x="20" y="182" xml:space="preserve">  <tspan fill="#ff7b72">✖</tspan> Fonts are loaded from Google (1 request). <tspan fill="#8b949e">google-fonts</tspan></text>
  <text x="20" y="201" xml:space="preserve"><tspan fill="#8b949e">      https://fonts.googleapis.com/css2?family=Lora&amp;display=swap</tspan></text>
  <text x="20" y="220" xml:space="preserve">      <tspan fill="#56d4dd">fix:</tspan> Self-host the font files. In Next.js, next/font/google downloads fonts at build time and…</text>
  <text x="20" y="239" xml:space="preserve">  <tspan fill="#e3b341">▲</tspan> YouTube loads before the visitor has given consent. <tspan fill="#8b949e">third-party-embeds</tspan></text>
  <text x="20" y="258" xml:space="preserve"><tspan fill="#8b949e">      https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ</tspan></text>
  <text x="20" y="277" xml:space="preserve">      <tspan fill="#56d4dd">fix:</tspan> Show a placeholder and load YouTube only after a click or consent. youtube-nocookie.com …</text>
